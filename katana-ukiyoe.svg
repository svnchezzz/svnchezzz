<svg viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="kwood" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.008" numOctaves="4" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer result="t"><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="t" operator="over"/>
    </filter>
    <filter id="kink">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>

    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fafafa"/>
      <stop offset="38%"  stop-color="#d8d8d8"/>
      <stop offset="66%"  stop-color="#a2a2a2"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>

    <pattern id="tsukaWrap" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#1f1f1f"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#727272" stroke-width="3.4"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="#3a3a3a" stroke-width="2.2"/>
    </pattern>

    <linearGradient id="sayaLac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3d434b"/>
      <stop offset="26%"  stop-color="#23272d"/>
      <stop offset="62%"  stop-color="#15181c"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="sayaFit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9aa3ae"/>
      <stop offset="45%"  stop-color="#5c646e"/>
      <stop offset="100%" stop-color="#262a30"/>
    </linearGradient>
    <pattern id="sayaGrain" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-3)">
      <line x1="0" y1="0" x2="9" y2="0" stroke="#000000" stroke-width="1.1" opacity="0.3"/>
      <line x1="0" y1="4.5" x2="9" y2="4.5" stroke="#6e7782" stroke-width="0.7" opacity="0.13"/>
    </pattern>

    <g id="petal">
      <path d="M0,-7 C 5,-5 8,0 5,5 C 3,8 -3,8 -5,5 C -8,0 -5,-5 0,-7 Z"
            fill="#8f1414" stroke="#3d0808" stroke-width="0.9"/>
      <path d="M0,-6 C 3,-4 4,0 2,4" fill="none" stroke="#c62b2b" stroke-width="0.9" opacity="0.85"/>
      <path d="M0,5 L0,7.5" stroke="#3d0808" stroke-width="0.9"/>
    </g>
  </defs>

  <rect width="1000" height="280" fill="#161616"/>
  <rect width="1000" height="280" fill="#1e1e1e" filter="url(#kwood)"/>

  <!-- niebla tallada -->
  <g opacity="0.3" filter="url(#kink)">
    <line x1="120" y1="40" x2="470" y2="40" stroke="#4c4c4c" stroke-width="3.5"/>
    <line x1="190" y1="54" x2="400" y2="54" stroke="#3a3a3a" stroke-width="3"/>
    <line x1="560" y1="246" x2="890" y2="246" stroke="#404040" stroke-width="3.5"/>
    <line x1="630" y1="258" x2="830" y2="258" stroke="#303030" stroke-width="3"/>
  </g>


  <!-- ═══════════ SAYA: la funda, en paralelo bajo la hoja ═══════════ -->
  <g transform="translate(40,234) rotate(-3)" filter="url(#kink)"
     stroke-linejoin="miter" stroke-miterlimit="8">

    <!-- cuerpo lacado -->
    <path d="M14,-21 C 230,-29 500,-45 786,-63
             L 812,-54
             C 520,-32 240,-13 14,-3 Z"
          fill="url(#sayaLac)" stroke="#08090b" stroke-width="3.6"/>
    <path d="M14,-21 C 230,-29 500,-45 786,-63 L 812,-54 C 520,-32 240,-13 14,-3 Z"
          fill="url(#sayaGrain)"/>
    <!-- filo de luz del lomo -->
    <path d="M18,-18 C 232,-26 500,-42 784,-59" fill="none" stroke="#98a1ac" stroke-width="2.2" opacity="0.6"/>
    <path d="M18,-6 C 240,-16 520,-35 806,-56" fill="none" stroke="#04060a" stroke-width="2.4" opacity="0.7"/>

    <!-- KOIGUCHI: boca de la funda, por donde entra la hoja -->
    <path d="M6,-22 L 46,-23.5 L 46,-4.5 L 6,-3 Z"
          fill="url(#sayaFit)" stroke="#08090b" stroke-width="3"/>
    <line x1="26" y1="-23" x2="26" y2="-4" stroke="#2a2f36" stroke-width="1.4"/>

    <!-- KURIKATA: el pasador del cordon -->
    <path d="M132,-30 L 168,-31.5 L 168,-23 L 132,-21.5 Z"
          fill="url(#sayaFit)" stroke="#08090b" stroke-width="2.4"/>

    <!-- SAGEO: el cordon de seda que lo ata -->
    <path d="M150,-24 C 146,-8 162,-2 152,10 C 145,18 156,24 150,32"
          fill="none" stroke="#8f1414" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M150,-24 C 156,-10 138,-4 150,8 C 157,16 145,22 152,30"
          fill="none" stroke="#5e0d0d" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- borla del cordon -->
    <g transform="translate(151,32)">
      <path d="M0,0 C -6,3 -6,10 0,13 C 6,10 6,3 0,0 Z" fill="#8f1414" stroke="#3d0808" stroke-width="1.6"/>
      <g stroke="#8f1414" stroke-width="2.4" stroke-linecap="round">
        <line x1="-4" y1="12" x2="-6" y2="26"/>
        <line x1="0"  y1="13" x2="0"  y2="29"/>
        <line x1="4"  y1="12" x2="6"  y2="25"/>
      </g>
    </g>

    <!-- KOJIRI: remate metalico del extremo -->
    <path d="M770,-62 L 786,-63 L 812,-54 L 800,-50 Z"
          fill="url(#sayaFit)" stroke="#08090b" stroke-width="2.8"/>
    <line x1="778" y1="-62.5" x2="792" y2="-53" stroke="#2a2f36" stroke-width="1.3"/>
  </g>

  <!-- ═══════ KATANA: todo el arma vive en un eje local unico ═══════ -->
  <g transform="translate(50,120) rotate(-3)" filter="url(#kink)"
     stroke-linejoin="miter" stroke-miterlimit="8">

    <!-- KASHIRA (pomo) -->
    <path d="M-20,-12 L-6,-12 L-6,12 L-20,12 Z" fill="#3a3a3a" stroke="#0d0d0d" stroke-width="3"/>

    <!-- TSUKA (mango trenzado) -->
    <path d="M-6,-12 L148,-13 L148,13 L-6,12 Z"
          fill="url(#tsukaWrap)" stroke="#0d0d0d" stroke-width="3.4"/>
    <!-- menuki -->
    <ellipse cx="66" cy="0" rx="11" ry="6.5" fill="#9a9a9a" stroke="#0d0d0d" stroke-width="2"/>

    <!-- FUCHI (collar del mango) -->
    <path d="M148,-14 L162,-14 L162,14 L148,14 Z" fill="#454545" stroke="#0d0d0d" stroke-width="3"/>

    <!-- TSUBA (guarda calada) -->
    <ellipse cx="170" cy="0" rx="9" ry="30" fill="#2b2b2b" stroke="#0d0d0d" stroke-width="3.4"/>
    <ellipse cx="170" cy="0" rx="4.5" ry="22" fill="none" stroke="#8a8a8a" stroke-width="1.7"/>
    <circle cx="170" cy="-13" r="2.8" fill="#161616" stroke="#8f8f8f" stroke-width="1.3"/>
    <circle cx="170" cy="13" r="2.8" fill="#161616" stroke="#8f8f8f" stroke-width="1.3"/>

    <!-- HABAKI (collar de la hoja) -->
    <path d="M179,-12 L201,-11 L201,11 L179,12 Z" fill="#bdbdbd" stroke="#0d0d0d" stroke-width="3"/>
    <line x1="190" y1="-11.5" x2="190" y2="11.5" stroke="#6f6f6f" stroke-width="1.5"/>

    <!-- HOJA: lomo, punta en vertice y filo, en un solo trazo cerrado -->
    <path d="M200,-11
             C 420,-20 680,-42 866,-58
             L 906,-50
             C 700,-16 420,2 200,11 Z"
          fill="url(#blade)" stroke="#0d0d0d" stroke-width="3.4"/>

    <!-- shinogi (arista del lomo) -->
    <path d="M206,-7 C 420,-16 680,-38 862,-54" fill="none" stroke="#909090" stroke-width="1.7"/>

    <!-- hamon ondulado -->
    <path d="M208,4 C 258,0 278,-8 328,-6 C 378,-4 398,-12 448,-10
             C 498,-8 518,-16 568,-15 C 618,-14 638,-22 688,-22
             C 738,-22 758,-30 808,-32 C 838,-33 850,-38 860,-41"
          fill="none" stroke="#7a7a7a" stroke-width="2.3" stroke-dasharray="11 5"/>

    <!-- ha (filo brillante) -->
    <path d="M200,11 C 420,2 700,-16 906,-50" fill="none" stroke="#fcfcfc" stroke-width="2.5"/>

    <!-- yokote: la linea que marca el inicio del kissaki -->
    <line x1="856" y1="-56" x2="850" y2="-40" stroke="#0d0d0d" stroke-width="2.4"/>
  </g>

  <!-- ═══════ PETALOS ROJOS ═══════ -->
  <g>
    <use href="#petal" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" values="120,-20; 96,300" dur="7s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="240,-30; 272,300" dur="9s" begin="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.6s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="1">
      <animateTransform attributeName="transform" type="translate" values="360,-25; 330,300" dur="6.2s" begin="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;300" dur="2.9s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="470,-40; 505,300" dur="8.4s" begin="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.2s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="580,-20; 552,300" dur="7.6s" begin="3.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="330;0" dur="3.7s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="690,-35; 724,300" dur="9.6s" begin="1.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="4.1s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="1">
      <animateTransform attributeName="transform" type="translate" values="800,-25; 770,300" dur="6.8s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;340" dur="3.2s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="900,-30; 932,300" dur="8.8s" begin="2.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.9s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="40,-40; 68,300" dur="10.2s" begin="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.6s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="640,-20; 618,300" dur="7.2s" begin="5.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;320" dur="3.5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="180,-35; 212,300" dur="9.2s" begin="3.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="300;0" dur="4.4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#petal" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" values="860,-25; 838,300" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.1s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <rect x="5" y="5" width="990" height="270" fill="none" stroke="#0d0d0d" stroke-width="7"/>
  <rect x="11" y="11" width="978" height="258" fill="none" stroke="#454545" stroke-width="1.4"/>
</svg>
