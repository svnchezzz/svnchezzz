<svg viewBox="0 0 1000 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="k_ink">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
    <filter id="k_wood" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.01" numOctaves="4" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer result="t"><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="t" operator="over"/>
    </filter>
    <pattern id="k_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#1c1c1c"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#5e5e5e" stroke-width="1.5"/>
    </pattern>
    <pattern id="k_wrap" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="10" height="10" fill="#242424"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7a7a7a" stroke-width="2.4"/>
    </pattern>
  </defs>

  <rect width="1000" height="130" fill="#161616"/>
  <rect width="1000" height="130" fill="#1e1e1e" filter="url(#k_wood)"/>

  <!-- saya (funda) con tramado -->
  <g filter="url(#k_ink)">
    <rect x="60" y="52" width="250" height="24" rx="11" fill="url(#k_hatch)" stroke="#0d0d0d" stroke-width="4"/>
    <line x1="88" y1="52" x2="88" y2="76" stroke="#0d0d0d" stroke-width="3"/>
    <line x1="284" y1="52" x2="284" y2="76" stroke="#0d0d0d" stroke-width="3"/>
  </g>

  <!-- tsuka (mango trenzado) -->
  <g filter="url(#k_ink)">
    <rect x="12" y="54" width="48" height="20" rx="5" fill="url(#k_wrap)" stroke="#0d0d0d" stroke-width="3.5"/>
  </g>

  <!-- tsuba (guarda) -->
  <g filter="url(#k_ink)">
    <circle cx="316" cy="64" r="16" fill="#2e2e2e" stroke="#0d0d0d" stroke-width="4"/>
    <circle cx="316" cy="64" r="7" fill="none" stroke="#9a9a9a" stroke-width="2"/>
  </g>

  <!-- hoja que se desenvaina -->
  <g filter="url(#k_ink)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-330,0; 0,0; 0,0; -330,0" keyTimes="0;0.34;0.74;1"
        dur="4.6s" repeatCount="indefinite"/>
      <!-- cuerpo de la hoja -->
      <path d="M330 54 L900 48 L946 64 L900 80 L330 74 Z"
            fill="#cfcfcf" stroke="#0d0d0d" stroke-width="4" stroke-linejoin="round"/>
      <!-- hamon (línea de temple) tramado -->
      <path d="M340 70 Q 460 60, 560 70 T 780 68 T 900 74"
            fill="none" stroke="#6e6e6e" stroke-width="2.5" stroke-dasharray="9 5"/>
      <!-- filo brillante -->
      <path d="M330 54 L900 48 L946 64" fill="none" stroke="#f2f2f2" stroke-width="3"/>
      <!-- shinogi -->
      <line x1="340" y1="60" x2="898" y2="55" stroke="#8f8f8f" stroke-width="1.6"/>
    </g>
  </g>

  <!-- corte / destello vertical -->
  <path d="M640 4 L664 65 L640 126" fill="none" stroke="#efefef" stroke-width="3" opacity="0" filter="url(#k_ink)">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.32;0.39;0.5;1" dur="4.6s" repeatCount="indefinite"/>
  </path>

  <rect x="4" y="4" width="992" height="122" fill="none" stroke="#0d0d0d" stroke-width="6"/>
</svg>
