<svg viewBox="0 0 1000 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wd" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.62" numOctaves="3" seed="7" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer result="t"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="t" operator="over"/>
    </filter>
    <linearGradient id="pl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#232019"/>
      <stop offset="52%"  stop-color="#191715"/>
      <stop offset="100%" stop-color="#131211"/>
    </linearGradient>
    <pattern id="sg" x="0" y="0" width="44" height="18" patternUnits="userSpaceOnUse">
      <path d="M0,18 A22,18 0 0,1 44,18" fill="none" stroke="#3f3a33" stroke-width="1.3"/>
      <path d="M-11,18 A22,18 0 0,1 33,18" fill="none" stroke="#2b2926" stroke-width="1.1"/>
      <path d="M11,18 A22,18 0 0,1 55,18" fill="none" stroke="#2b2926" stroke-width="1.1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="38%"  stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="96" fill="#151412"/>
  <rect width="1000" height="96" fill="#1f1c18" filter="url(#wd)"/>
  <rect width="1000" height="96" fill="url(#pl)" opacity="0.55"/>

  <!-- olas al fondo, apagadas bajo el texto -->
  <rect x="0" y="52" width="1000" height="40" fill="url(#sg)" opacity="0.6"/>
  <rect x="0" y="0" width="620" height="96" fill="url(#fade)"/>

  <!-- kanji grabado -->
  <text x="42" y="70" font-family="serif" font-size="42" fill="#000000" opacity="0.65">音</text>
  <text x="40" y="68" font-family="serif" font-size="42" fill="#6e6558">音</text>

  <!-- separador -->
  <circle cx="104" cy="56" r="3.4" fill="#8a7333" opacity="0.85"/>

  <!-- titulo grabado -->
  <text x="126" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="30"
        font-weight="bold" fill="#000000" opacity="0.6" letter-spacing="3">Now Playing</text>
  <text x="124" y="67" font-family="Georgia, 'Times New Roman', serif" font-size="30"
        font-weight="bold" fill="#ddd8cf" letter-spacing="3">Now Playing</text>

  <!-- hilos dorados -->
  <line x1="0" y1="5" x2="1000" y2="5" stroke="#8a7333" stroke-width="1.4" opacity="0.5"/>
  <line x1="0" y1="91" x2="1000" y2="91" stroke="#8a7333" stroke-width="1.4" opacity="0.35"/>
  <line x1="0" y1="2" x2="1000" y2="2" stroke="#0b0a09" stroke-width="4"/>
  <line x1="0" y1="94" x2="1000" y2="94" stroke="#0b0a09" stroke-width="4"/>
</svg>
