<svg viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="f_ink">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <filter id="f_wood" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.008" numOctaves="4" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer result="t"><feFuncA type="linear" slope="0.17"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="t" operator="over"/>
    </filter>

    <!-- cielo del amanecer: de ambar rosado tenue arriba del horizonte hacia la noche -->
    <linearGradient id="dawnSky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#6b4a3a" stop-opacity="0.55"/>
      <stop offset="22%"  stop-color="#5c4038" stop-opacity="0.38"/>
      <stop offset="48%"  stop-color="#3d3138" stop-opacity="0.22"/>
      <stop offset="78%"  stop-color="#252a33" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1b1b1b" stop-opacity="0"/>
    </linearGradient>

    <!-- resplandor del sol naciente -->
    <radialGradient id="dawnGlow" cx="50%" cy="100%" r="72%">
      <stop offset="0%"   stop-color="#c9a077" stop-opacity="0.42"/>
      <stop offset="35%"  stop-color="#a8735c" stop-opacity="0.22"/>
      <stop offset="70%"  stop-color="#6b4a4a" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#1b1b1b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunDisc" cx="50%" cy="60%" r="55%">
      <stop offset="0%"   stop-color="#e6cfae"/>
      <stop offset="70%"  stop-color="#d0b391"/>
      <stop offset="100%" stop-color="#b8967a"/>
    </radialGradient>

    <pattern id="f_hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#1c1c1c"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#565656" stroke-width="1.5"/>
    </pattern>
    <pattern id="f_hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="10" height="10" fill="#26242a"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7d7982" stroke-width="1.3"/>
    </pattern>

    <!-- el sol y su resplandor quedan ocultos bajo la linea del horizonte -->
    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="1000" height="150"/>
    </clipPath>
  </defs>

  <rect width="1000" height="180" fill="#161616"/>
  <rect width="1000" height="180" fill="#1e1e1e" filter="url(#f_wood)"/>

  <!-- ═══ AMANECER ═══ -->
  <g clip-path="url(#aboveHorizon)">
    <rect x="0" y="30" width="1000" height="120" fill="url(#dawnSky)"/>
    <ellipse cx="500" cy="150" rx="330" ry="120" fill="url(#dawnGlow)"/>
    <!-- disco naciente, medio hundido tras los montes -->
    <circle cx="500" cy="146" r="40" fill="url(#sunDisc)" opacity="0.9" filter="url(#f_ink)"/>
    <circle cx="500" cy="146" r="40" fill="none" stroke="#0d0d0d" stroke-width="2.5" opacity="0.75"/>
  </g>

  <!-- bandas de niebla teñidas por la luz -->
  <g filter="url(#f_ink)">
    <line x1="300" y1="118" x2="700" y2="118" stroke="#8a6a58" stroke-width="4" opacity="0.35"/>
    <line x1="360" y1="130" x2="640" y2="130" stroke="#9a7a64" stroke-width="4" opacity="0.28"/>
    <line x1="60"  y1="86"  x2="330" y2="86"  stroke="#4e4e4e" stroke-width="4" opacity="0.5"/>
    <line x1="120" y1="98"  x2="290" y2="98"  stroke="#3a3a3a" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- montes: los del centro recortan el sol -->
  <g filter="url(#f_ink)">
    <path d="M330 150 L470 62 L520 100 L560 68 L700 150 Z" fill="url(#f_hatch2)" stroke="#0d0d0d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M470 62 L520 100 L560 68 L534 88 L520 78 L497 92 Z" fill="#e0dcd6" stroke="#0d0d0d" stroke-width="2"/>
    <!-- ladera iluminada por el amanecer -->
    <path d="M470 62 L520 100 L497 92 Z" fill="#c9a077" opacity="0.18"/>
    <path d="M640 150 L760 82 L880 150 Z" fill="url(#f_hatch)" stroke="#0d0d0d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M760 82 L820 116 L760 150 Z" fill="#c9a077" opacity="0.1"/>
  </g>

  <!-- pinos en silueta -->
  <g filter="url(#f_ink)" fill="#0f0f0f" stroke="#4a4a4a" stroke-width="1.6">
    <path d="M80 150 L92 118 L104 150 Z"/>
    <path d="M84 132 L92 108 L100 132 Z"/>
    <rect x="90" y="150" width="4" height="12"/>
    <path d="M916 150 L930 112 L944 150 Z"/>
    <path d="M920 128 L930 100 L940 128 Z"/>
    <rect x="928" y="150" width="4" height="12"/>
  </g>

  <!-- suelo, con reflejo calido del sol -->
  <rect x="0" y="150" width="1000" height="30" fill="#0f0f0f"/>
  <rect x="330" y="150" width="340" height="30" fill="#a8825f" opacity="0.09"/>
  <line x1="0" y1="150" x2="1000" y2="150" stroke="#0d0d0d" stroke-width="5"/>
  <g opacity="0.5">
    <line x1="0" y1="160" x2="1000" y2="160" stroke="#3a3a3a" stroke-width="1.4"/>
    <line x1="0" y1="170" x2="1000" y2="170" stroke="#2e2e2e" stroke-width="1.2"/>
  </g>

  <rect x="5" y="5" width="990" height="170" fill="none" stroke="#0d0d0d" stroke-width="7"/>
  <rect x="11" y="11" width="978" height="158" fill="none" stroke="#454545" stroke-width="1.4"/>
</svg>
