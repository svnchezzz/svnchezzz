<svg viewBox="0 0 1000 224" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="f_ink">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <filter id="f_wood" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.008" numOctaves="4" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer result="t"><feFuncA type="linear" slope="0.17"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="t" operator="over"/>
    </filter>
    <filter id="f_soft"><feGaussianBlur stdDeviation="2.4"/></filter>

    <linearGradient id="dawnSky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#6b4a3a" stop-opacity="0.55"/>
      <stop offset="22%"  stop-color="#5c4038" stop-opacity="0.38"/>
      <stop offset="48%"  stop-color="#3d3138" stop-opacity="0.22"/>
      <stop offset="78%"  stop-color="#252a33" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1b1b1b" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dawnGlow" cx="50%" cy="100%" r="72%">
      <stop offset="0%"   stop-color="#c9a077" stop-opacity="0.42"/>
      <stop offset="35%"  stop-color="#a8735c" stop-opacity="0.22"/>
      <stop offset="70%"  stop-color="#6b4a4a" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#1b1b1b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunDisc" cx="50%" cy="60%" r="55%">
      <stop offset="0%"   stop-color="#e6cfae"/>
      <stop offset="70%"  stop-color="#d0b391"/>
      <stop offset="100%" stop-color="#b8967a"/>
    </radialGradient>

    <!-- reflejo del suelo, difuminado en los extremos para que no deje borde recto -->
    <linearGradient id="groundGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a8825f" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#a8825f" stop-opacity="0.10"/>
      <stop offset="50%"  stop-color="#c19a6f" stop-opacity="0.13"/>
      <stop offset="72%"  stop-color="#a8825f" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a8825f" stop-opacity="0"/>
    </linearGradient>

    <!-- nubes: mas densas al centro, disueltas en los bordes -->
    <linearGradient id="cloudWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b98a6a" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#b98a6a" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#d0a37c" stop-opacity="0.7"/>
      <stop offset="85%"  stop-color="#b98a6a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b98a6a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloudCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6a6f78" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#6a6f78" stop-opacity="0.5"/>
      <stop offset="60%"  stop-color="#858b95" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#6a6f78" stop-opacity="0"/>
    </linearGradient>

    <pattern id="f_hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="10" height="10" fill="#26242a"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7d7982" stroke-width="1.3"/>
    </pattern>
    <pattern id="f_hatchBack" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#1d1d20"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3c3c42" stroke-width="1.2"/>
    </pattern>

    <clipPath id="aboveHorizon"><rect x="0" y="0" width="1000" height="150"/></clipPath>
    <clipPath id="fFrame"><rect x="0" y="0" width="1000" height="180"/></clipPath>
  </defs>

  <g transform="translate(0,44)">

  <rect width="1000" height="180" fill="#161616"/>
  <rect width="1000" height="180" fill="#1e1e1e" filter="url(#f_wood)"/>

  <g clip-path="url(#fFrame)">

    <!-- ═══ CIELO Y SOL NACIENTE ═══ -->
    <g clip-path="url(#aboveHorizon)">
      <rect x="0" y="20" width="1000" height="130" fill="url(#dawnSky)">
        <animate attributeName="opacity" values="0.55;1;1;0.55" keyTimes="0;0.28;0.72;1" dur="20s" repeatCount="indefinite"/>
      </rect>

      <ellipse cx="500" cy="150" rx="330" ry="120" fill="url(#dawnGlow)">
        <animate attributeName="opacity" values="0.25;1;1;0.25" keyTimes="0;0.3;0.7;1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="96;124;124;96" keyTimes="0;0.3;0.7;1" dur="20s" repeatCount="indefinite"/>
      </ellipse>

      <g filter="url(#f_ink)">
        <circle cx="500" cy="146" r="40" fill="url(#sunDisc)">
          <animate attributeName="cy" values="178;140;140;178" keyTimes="0;0.32;0.7;1" dur="20s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.2;0.9;0.9;0.2" keyTimes="0;0.32;0.7;1" dur="20s" repeatCount="indefinite"/>
        </circle>
        <circle cx="500" cy="146" r="40" fill="none" stroke="#0d0d0d" stroke-width="2.5" opacity="0.7">
          <animate attributeName="cy" values="178;140;140;178" keyTimes="0;0.32;0.7;1" dur="20s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- ═══ CORDILLERA DE FONDO, con su ladera iluminada ═══ -->
    <g filter="url(#f_ink)" opacity="0.8">
      <path d="M600 150 L700 104 L742 124 L790 96 L850 126 L900 150 Z"
            fill="url(#f_hatchBack)" stroke="#2a2a30" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M700 104 L742 124 L722 118 Z" fill="#c9a077" opacity="0.26">
        <animate attributeName="opacity" values="0.15;0.34;0.34;0.15" keyTimes="0;0.34;0.7;1" dur="20s" repeatCount="indefinite"/>
      </path>
      <path d="M790 96 L850 126 L900 150 L812 150 Z" fill="#c9a077" opacity="0.2">
        <animate attributeName="opacity" values="0.12;0.28;0.28;0.12" keyTimes="0;0.34;0.7;1" dur="20s" repeatCount="indefinite"/>
      </path>

      <path d="M120 150 L200 112 L246 132 L300 150 Z"
            fill="url(#f_hatchBack)" stroke="#2a2a30" stroke-width="2" stroke-linejoin="round"/>
      <path d="M200 112 L246 132 L228 126 Z" fill="#c9a077" opacity="0.2">
        <animate attributeName="opacity" values="0.12;0.28;0.28;0.12" keyTimes="0;0.34;0.7;1" dur="20s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ═══ NUBES: bandas largas que cruzan la escena ═══ -->
    <g filter="url(#f_soft)">
      <!-- banda alta, calida, lenta -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="-340,0; 1060,0" dur="26s" repeatCount="indefinite"/>
        <path d="M0,44 C 60,32 150,32 210,42 C 260,50 300,46 340,44 C 300,54 240,58 170,56 C 100,54 40,52 0,44 Z"
              fill="url(#cloudWarm)" opacity="0.5"/>
      </g>
      <!-- banda media, gris, mas rapida -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="1060,0; -420,0" dur="19s" repeatCount="indefinite"/>
        <path d="M0,74 C 80,62 190,62 270,72 C 340,80 390,76 420,74 C 380,86 300,90 200,88 C 110,86 40,84 0,74 Z"
              fill="url(#cloudCool)" opacity="0.42"/>
      </g>
      <!-- banda baja, encendida por el sol, lenta -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="-380,0; 1060,0" dur="33s" repeatCount="indefinite"/>
        <path d="M0,110 C 90,100 210,100 300,110 C 350,116 380,114 380,112 C 330,124 230,128 130,126 C 60,124 20,120 0,110 Z"
              fill="url(#cloudWarm)" opacity="0.55"/>
      </g>
      <!-- jirones finos -->
      <g opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="1060,0; -300,0" dur="15s" repeatCount="indefinite"/>
        <path d="M0,58 C 70,52 160,52 230,58 C 170,64 80,64 0,58 Z" fill="url(#cloudCool)"/>
      </g>
      <g opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="-280,0; 1060,0" dur="22s" begin="-8s" repeatCount="indefinite"/>
        <path d="M0,94 C 70,86 170,86 250,94 C 180,102 80,102 0,94 Z" fill="url(#cloudWarm)"/>
      </g>
    </g>

    <!-- ═══ MONTE PRINCIPAL, completo y al frente ═══ -->
    <g filter="url(#f_ink)">
      <path d="M300 150 L470 56 L522 98 L566 62 L740 150 Z"
            fill="url(#f_hatch2)" stroke="#0d0d0d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M470 56 L522 98 L566 62 L538 86 L522 74 L497 90 Z" fill="#e0dcd6" stroke="#0d0d0d" stroke-width="2"/>
      <path d="M470 56 L522 98 L497 90 Z" fill="#c9a077" opacity="0.3">
        <animate attributeName="opacity" values="0.18;0.42;0.42;0.18" keyTimes="0;0.34;0.7;1" dur="20s" repeatCount="indefinite"/>
      </path>
      <path d="M566 62 L620 108 L740 150 L640 150 Z" fill="#c9a077" opacity="0.16">
        <animate attributeName="opacity" values="0.09;0.22;0.22;0.09" keyTimes="0;0.34;0.7;1" dur="20s" repeatCount="indefinite"/>
      </path>
      <!-- filo de luz sobre la arista, del lado del sol -->
      <path d="M470 56 L522 98 L566 62" fill="none" stroke="#e8bd8e" stroke-width="2.2" opacity="0.45" stroke-linejoin="round">
        <animate attributeName="opacity" values="0.28;0.6;0.6;0.28" keyTimes="0;0.34;0.7;1" dur="20s" repeatCount="indefinite"/>
      </path>
      <path d="M566 62 L740 150" fill="none" stroke="#d8a97e" stroke-width="1.8" opacity="0.3">
        <animate attributeName="opacity" values="0.18;0.42;0.42;0.18" keyTimes="0;0.34;0.7;1" dur="20s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ═══ PINOS ═══ -->
    <g filter="url(#f_ink)" fill="#0f0f0f" stroke="#4a4a4a" stroke-width="1.6">
      <path d="M80 150 L92 118 L104 150 Z"/>
      <path d="M84 132 L92 108 L100 132 Z"/>
      <rect x="90" y="150" width="4" height="12"/>
      <path d="M916 150 L930 112 L944 150 Z"/>
      <path d="M920 128 L930 100 L940 128 Z"/>
      <rect x="928" y="150" width="4" height="12"/>
    </g>

    <!-- ═══ SUELO ═══ -->
    <rect x="0" y="150" width="1000" height="30" fill="#0f0f0f"/>
    <rect x="0" y="150" width="1000" height="30" fill="url(#groundGlow)">
      <animate attributeName="opacity" values="0.5;1;1;0.5" keyTimes="0;0.34;0.7;1" dur="20s" repeatCount="indefinite"/>
    </rect>
    <line x1="0" y1="150" x2="1000" y2="150" stroke="#0d0d0d" stroke-width="5"/>
    <g opacity="0.5">
      <line x1="0" y1="160" x2="1000" y2="160" stroke="#3a3a3a" stroke-width="1.4"/>
      <line x1="0" y1="170" x2="1000" y2="170" stroke="#2e2e2e" stroke-width="1.2"/>
    </g>

  </g>

  <rect x="5" y="5" width="990" height="170" fill="none" stroke="#0d0d0d" stroke-width="7"/>
  <rect x="11" y="11" width="978" height="158" fill="none" stroke="#454545" stroke-width="1.4"/>
  </g>
</svg>
