<svg viewBox="0 0 1000 46" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="d_ink">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
    </filter>
    <filter id="d_wood" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.02" numOctaves="4" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer result="t"><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="t" operator="over"/>
    </filter>
    <pattern id="d_wave" x="0" y="0" width="56" height="46" patternUnits="userSpaceOnUse">
      <rect width="56" height="46" fill="#181b20"/>
      <path d="M-4,40 C 8,16 20,16 28,32 C 36,48 48,44 60,26" fill="none" stroke="#546274" stroke-width="2.6"/>
      <path d="M-4,30 C 8,8 20,8 28,22 C 36,38 48,34 60,16" fill="none" stroke="#2f3742" stroke-width="2.2"/>
    </pattern>
  </defs>
  <rect width="1000" height="46" fill="url(#d_wave)" filter="url(#d_wood)"/>
  <g filter="url(#d_ink)">
    <line x1="0" y1="3" x2="1000" y2="3" stroke="#0d0d0d" stroke-width="6"/>
    <line x1="0" y1="43" x2="1000" y2="43" stroke="#0d0d0d" stroke-width="6"/>
  </g>
</svg>
